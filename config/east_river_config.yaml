project:
  analysis_start_datetime: "2017-10-01 00:00:00"
  analysis_end_datetime: "2026-06-30 23:00:00"
  water_years: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
  overwrite: True
  log_level: INFO

paths:
  # Full WBDHU10 layer is read; only the East River feature is selected below.
  watershed_shapefile: "/bsuscratch/zihaozhang/Shape-file/NHD_HU4_downloads/unzipped/HUC4-1402/Shape/WBDHU10.shp"
  isnobal_root_template: "/bsuscratch/zihaozhang/iSnobal/erw_2nd/katana_{wy}/model_out/erw/wy{wy}/with_spinup"
  isnobal_topo_file: "/bsuscratch/zihaozhang/iSnobal/erw_2nd/katana_2017/topo.nc"

  # ONE LDASOUT file containing all 85,439 hourly records.
  # Its Time coordinate is numeric (0, 1, 2, ..., 85438), not a datetime.
  # The filename is not parsed to build timestamps.
  noahmp_output_file: "/bsuscratch/zihaozhang/NOAH-MP/hrldas/hrldas/run/cases/HRRR/erw_ultimate/outmy_hourly/2016100101.LDASOUT_DOMAIN1"
  noahmp_geo_file: "/bsuscratch/zihaozhang/WPS/geo_em.d01.nc"
  snotel_csv: "/bsuscratch/zihaozhang/Codes/snotel-data/snotel_2017-10-01_2026-06-30_daily/snotel_all_months.csv"
  aso_directory: "/bsuscratch/zihaozhang/ASO/download"
  output_dir: "/bsuscratch/zihaozhang/iSnobal/East_River_Workflow_Code_v0.8.2/output/output1"

watershed:
  name_field: name
  name_contains: "East River"
  fractional_chunk_size: 50000

isnobal:
  daily_folder_pattern: "run{date:%Y%m%d}"
  snow_filename: snow.nc
  precip_filename: precip.nc
  percent_snow_filename: percent_snow.nc
  energy_filename: em.nc
  incoming_sw_filename: hrrr_solar.nc
  absorbed_sw_filename: net_solar.nc
  swe_variable: specific_mass
  snow_depth_variable: thickness
  precip_variable: precip
  percent_snow_variable: percent_snow
  swi_variable: SWI
  snowmelt_variable: snowmelt
  incoming_sw_variable: hrrr_solar
  absorbed_sw_variable: net_solar
  dem_variable: dem
  time_index: -1
  missing_file_policy: error
  expected_hourly_timesteps: 24
  minimum_regrid_valid_coverage: 0.50

noahmp:
  # Production LDASOUT Time values are 0, 1, 2, ..., 85438.
  # Time=0 represents 2016-10-01 01:00:00 and each increment is one hour.
  time_coordinate_mode: numeric_index
  time_variable: Time
  output_start_datetime: "2016-10-01 01:00:00"
  expected_timestep_hours: 1
  daily_state_hour: 23

  # Optional validation checks. The count is known; first/last decoded times
  # are left null so they are reported rather than independently enforced.
  expected_record_count: 85439
  expected_first_time: null
  expected_last_time: null
  daily_incomplete_policy: error

  swe_variable: SNEQV
  snow_depth_variable: SNOWH
  precip_variable: RAINRATE
  snowfall_variable: QSNOW
  melt_variable: QMELT
  snow_bottom_release_variable: QSNBOT
  incoming_sw_variable: SWFORC
  absorbed_sw_variable: FSA
  latitude_variable: XLAT_M
  longitude_variable: XLONG_M
  elevation_variable: HGT_M

h1:
  start_month_day: "11-01"
  end_month_day: "03-15"
  event_threshold_mm_day: 1.0

h2:
  fractions: [0.75, 0.50, 0.25]
  event_threshold_mm_day: 1.0
  disappearance_threshold_swe_mm: 10.0
  disappearance_consecutive_days: 7
  ablation_start_month_day: "04-01"
  ablation_end_month_day: "06-30"

snow_disappearance:
  threshold_depth_mm: 25.0
  consecutive_days: 7

h3:
  start_month_day: "04-01"
  end_month_day: "06-30"
  incoming_sw_minimum_mj_m2_day: 0.05
  melt_day_threshold_mm: 0.1

h4:
  season_start_month_day: "03-01"
  season_end_month_day: "09-30"

aso:
  dates:
    [
      "20180331",
      "20180524",
      "20190407",
      "20190610",
      "20220421",
      "20220518",
      "20230401",
      "20230523",
      "20240403",
      "20240520",
      "20250407",
      "20250520",
      "20260318",
      "20260405",
    ]
  swe_pattern: "ASO_50M_SWE_USCOGE_{date}.tif"
  snow_depth_pattern: "ASO_50M_SD_USCOGE_{date}.tif"
  minimum_valid_coverage: 0.50
  map_robust_percentile: 99.0

  # Optional explicit categorical map breaks in mm. null = derive clean common
  # breaks from all configured ASO dates.
  swe_state_breaks_mm: null
  snow_depth_state_breaks_mm: null
  swe_difference_breaks_mm: null
  snow_depth_difference_breaks_mm: null
  quality_control:
    enabled: true
    negative_clip_tolerance_mm: 1.0
    swe_hard_max_mm: 5000.0
    snow_depth_hard_max_mm: 15000.0
    display_percentile: 99.5
    top_values_per_raster: 20
    maximum_adjusted_cell_records: 100000
    density_minimum_snow_depth_mm: 100.0
    density_review_min_kg_m3: 50.0
    density_review_max_kg_m3: 700.0
    density_hard_max_kg_m3: 1000.0

snotel:
  date_column: Date
  id_column: ID
  precip_column: "Precipitation Increment (mm)"
  swe_column: "Snow Water Equivalent (mm)"
  snow_depth_column: "Snow Depth (mm)"
  gapfill_precip_with_isnobal: true
  stations:
    - {id: 380, name: Butte, latitude: 38.89433, longitude: -106.95300, elevation_ft: 10160}
    - {id: 737, name: Schofield Pass, latitude: 39.01522, longitude: -107.04877, elevation_ft: 10700}
    - {id: 1141, name: Upper Taylor, latitude: 38.99077, longitude: -106.75422, elevation_ft: 10640}

streamflow:
  usgs_site: "09112500"
  parameter_code: "00060"
  statistic_code: "00003"
  rolling_days: 7
  api_mode: modern_with_legacy_fallback
  api_key_environment_variable: USGS_API_KEY
  request_timeout_seconds: 120
  page_size: 10000

plotting:
  font_family: DejaVu Sans
  fallback_font: DejaVu Sans
  font_size: 20
  dpi: 300
  figure_format: png
  close_after_save: true
  line_width: 1.6

  # null = automatic tight shared range. Set numeric values for manual ranges.
  watershed_swe_ymax_mm: null
  watershed_snow_depth_ymax_mm: null
  watershed_swe_y_step_mm: 100.0
  watershed_snow_depth_y_step_mm: 100.0
  station_swe_ymax_mm: null
  station_snow_depth_ymax_mm: null
