[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "east-river-workflow"
version = "0.8.2"
description = "Reproducible East River iSnobal, Noah-MP, SNOTEL, ASO, and USGS analysis workflow"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "xarray>=2023.1",
  "netCDF4>=1.6",
  "h5netcdf>=1.2",
  "geopandas>=0.14",
  "shapely>=2.0",
  "rasterio>=1.3",
  "pyproj>=3.5",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
  "requests>=2.31",
  "python-docx>=1.1",
]

[project.optional-dependencies]
plotting-workbench = [
  "jupyterlab>=4",
  "ipykernel>=6",
]

[project.scripts]
east-river = "east_river_workflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
